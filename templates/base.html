<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}neTV{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/vendor/tailwindcss-3.4.17.js"></script>
  <script src="/static/vendor/htmx-2.0.4.min.js"></script>
  <script src="/static/vendor/hls-1.7.3.min.js"></script>
  <script>
    window.__onGCastApiAvailable = function(isAvailable) {
      console.log('[CAST] onGCastApiAvailable:', isAvailable);
    };
  </script>
  <!-- Vendored copies above so the app (downloads included) works with no internet.
       Cast is the only remote script: async, so an unreachable gstatic never blocks the page. -->
  <script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"
          onload="console.log('[CAST] Script loaded')"
          onerror="console.log('[CAST] Script failed to load')"></script>
  <style>
    /* Focus styles */
    a:focus, button:focus, .focusable:focus { outline: none; }
    .nav-link:focus, .nav-link.active {
      background-color: rgb(59 130 246);
    }
    /* Scroll containers need padding for ring visibility */
    .scroll-ring-safe { padding: 2px; margin: -2px; }
    /* Downloads */
    .dl-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; color: #fff; cursor: pointer; z-index: 10; }
    .dl-btn[hidden] { display: none; }
    .dl-btn .dl-txt:empty { display: none; }
    .dl-btn.dl-card, .dl-btn.dl-row { position: absolute; top: 0.5rem; left: 0.5rem; min-width: 2rem; height: 2rem; padding: 0 0.4rem; border-radius: 9999px; background: rgba(0,0,0,0.6); font-size: 0.7rem; transition: opacity .15s; }
    .dl-btn.dl-row { left: auto; right: 0.5rem; }
    .dl-btn.dl-card.dl-idle, .dl-btn.dl-row.dl-idle { opacity: 0; }
    .group:hover .dl-btn.dl-idle, .dl-btn.dl-idle:focus-visible { opacity: 1; }
    @media (hover: none) { .dl-btn.dl-card.dl-idle, .dl-btn.dl-row.dl-idle { opacity: 0.85; } }
    .dl-btn.dl-inline { padding: 0.5rem 1rem; border-radius: 0.5rem; background: rgb(55 65 81); font-size: 1rem; }
    .dl-btn.dl-inline:hover { background: rgb(75 85 99); }
    .dl-btn:focus-visible { outline: 2px solid rgb(59 130 246); outline-offset: 2px; }
    .dl-btn[data-state="done"] { color: #4ade80; }
    .dl-btn[data-state="error"] { color: #f87171; }
    .dl-btn[data-state="paused"] { color: #fbbf24; }
    .dl-spin { animation: dl-rot 1.4s linear infinite; }
    @keyframes dl-rot { to { transform: rotate(360deg); } }
    .dl-toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: rgb(31 41 55); color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; box-shadow: 0 4px 12px rgba(0,0,0,.5); font-size: 0.875rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; max-width: 90vw; }
    .dl-toast.show { opacity: 1; }
    .dl-disabled { opacity: 0.35; pointer-events: none; cursor: not-allowed; }
    .offline-banner { position: fixed; top: 0; left: 2.5rem; right: 0; z-index: 90; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.75rem; padding: 0.25rem 0.75rem; background: #b45309; color: #fff; font-size: 0.8rem; }
    .offline-banner[hidden] { display: none; }
    .offline-banner-link { background: rgba(0,0,0,.3); padding: 0.1rem 0.6rem; border-radius: 0.25rem; }
    .offline-banner-link:hover { background: rgba(0,0,0,.5); }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="h-full bg-gray-900 text-gray-100 overflow-hidden">
  <div class="flex h-full min-w-0">
    <!-- Sidebar -->
    <nav class="bg-gray-800 flex flex-col py-4 items-center gap-4 w-10 flex-shrink-0">
      <a href="/guide" class="nav-link p-1.5 rounded hover:bg-gray-700 {% if request.url.path == '/guide' %}active{% endif %}" tabindex="0" title="TV en direct">
        <svg class="w-6 h-6" fill="none" stroke="white" viewBox="0 0 24 24" stroke-linecap="round">
          <!-- Tower legs -->
          <line x1="12" y1="4" x2="8" y2="21" stroke-width="1.2"/>
          <line x1="12" y1="4" x2="16" y2="21" stroke-width="1.2"/>
          <!-- X-pattern trusses -->
          <line x1="10.6" y1="10" x2="14.6" y2="15" stroke-width="0.7"/>
          <line x1="13.4" y1="10" x2="9.4" y2="15" stroke-width="0.7"/>
          <line x1="9.2" y1="16" x2="15.9" y2="20.5" stroke-width="0.7"/>
          <line x1="14.8" y1="16" x2="8.1" y2="20.5" stroke-width="0.7"/>
          <!-- Broadcast waves (more spacing) -->
          <path d="M10.5 2.5 A 2 2 0 0 0 10.5 5.5" stroke-width="1"/>
          <path d="M13.5 2.5 A 2 2 0 0 1 13.5 5.5" stroke-width="1"/>
          <path d="M8.5 1.5 A 4 4 0 0 0 8.5 6.5" stroke-width="1"/>
          <path d="M15.5 1.5 A 4 4 0 0 1 15.5 6.5" stroke-width="1"/>
          <path d="M6.5 0.5 A 6 6 0 0 0 6.5 7.5" stroke-width="1"/>
          <path d="M17.5 0.5 A 6 6 0 0 1 17.5 7.5" stroke-width="1"/>
        </svg>
      </a>
      {% set access = content_access if content_access is defined else get_content_access_from_request(request) %}
      {% if access.movies %}
      <a href="/vod" class="nav-link p-1.5 rounded hover:bg-gray-700 {% if request.url.path.startswith('/vod') %}active{% endif %}" tabindex="0" title="Films">
        <svg class="w-6 h-6" fill="white" viewBox="0 0 24 24">
          <!-- Board -->
          <rect x="4" y="10" width="16" height="10" rx="1"/>
          <!-- Clapper top angled at 15deg -->
          <g transform="rotate(-15 4 9)">
            <rect x="4" y="5" width="16" height="4" fill="white"/>
            <rect x="6" y="5" width="2.5" height="4" fill="black"/>
            <rect x="10" y="5" width="2.5" height="4" fill="black"/>
            <rect x="14" y="5" width="2.5" height="4" fill="black"/>
          </g>
        </svg>
      </a>
      {% endif %}
      {% if access.series %}
      <a href="/series" class="nav-link p-1.5 rounded hover:bg-gray-700 {% if request.url.path.startswith('/series') %}active{% endif %}" tabindex="0" title="Séries">
        <svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      </a>
      {% endif %}
      <a href="/search" class="nav-link p-1.5 rounded hover:bg-gray-700 {% if request.url.path == '/search' %}active{% endif %}" tabindex="0" title="Rechercher">
        <svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </a>
      <a href="/downloads" id="dl-nav-link" class="nav-link relative p-1.5 rounded hover:bg-gray-700 {% if request.url.path == '/downloads' %}active{% endif %}" tabindex="0" title="Téléchargements" aria-label="Téléchargements">
        <svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
        <span id="dl-nav-badge" hidden class="absolute -top-0.5 -right-0.5 min-w-[1rem] h-4 px-1 rounded-full bg-orange-500 text-white text-[10px] leading-4 text-center font-semibold"></span>
      </a>
      <a href="/settings" class="nav-link p-1.5 rounded hover:bg-gray-700 {% if request.url.path == '/settings' %}active{% endif %}" tabindex="0" title="Paramètres">
        <svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </a>
      <div class="mt-auto">
        <a href="/logout" class="text-gray-400 hover:text-white text-xs p-1.5 block" title="Se déconnecter">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto p-2 min-w-0">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/downloads-utils.js"></script>
  <script src="/static/js/downloads-ui.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

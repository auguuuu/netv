      {% for s in series %}
      <div class="series-card relative group" data-series-id="{{ s.series_id }}" data-series-name="{{ s.name }}" data-series-cover="{{ (s.cover or '') | logo_url }}">
        <a href="/series/{{ s.series_id }}"
           class="block bg-gray-800 rounded-lg overflow-hidden hover:ring-2 hover:ring-blue-500 focus:ring-2 focus:ring-blue-500 focusable transition-all"
           tabindex="0" data-nav="grid" title="{{ s.name }}{% if s.rating %}&#10;★ {{ s.rating }}{% endif %}">
          <div class="aspect-[2/3] bg-gray-700">
            {% if s.cover %}
            <img src="{{ s.cover | logo_url }}" alt="" class="w-full h-full object-cover" loading="lazy"
                 onerror="this.style.display='none'">
            {% endif %}
          </div>
          <div class="p-2">
            <div class="text-sm line-clamp-2 leading-tight">{{ s.name }}</div>
            {% if s.rating %}
            <div class="text-xs text-yellow-400 mt-1">★ {{ s.rating }}</div>
            {% endif %}
          </div>
        </a>
        <button type="button" class="fav-btn absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 text-xl opacity-0 group-hover:opacity-100 transition-opacity z-10"
                onclick='toggleFavorite({{ s.series_id | tojson }}, {{ s.name | tojson }}, {{ (s.cover or "") | logo_url | tojson }})'>
          ☆
        </button>
      </div>
      {% endfor %}
{% if next_url %}
<div class="col-span-full flex justify-center py-4 load-more">
  <button type="button" class="px-6 py-2 rounded bg-gray-700 hover:bg-gray-600 focusable" tabindex="0"
          hx-get="{{ next_url }}" hx-target="closest .load-more" hx-swap="outerHTML" hx-disabled-elt="this">
    Charger plus
  </button>
</div>
{% endif %}
